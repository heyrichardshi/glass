# Production composition. Copied to the server as /srv/glass/docker-compose.yml.
#
# Expects two files alongside it:
#   .env.api     the API's runtime environment, injected into the container.
#   .deploy_sha  one line: the image tag to run.
#                deploy.sh exports it as GLASS_SHA before invoking Compose.

services:
  api:
    image: ghcr.io/heyrichardshi/glass-server:${GLASS_SHA:?export GLASS_SHA from .deploy_sha}
    restart: unless-stopped
    env_file: ./.env.api
    command: ["node", "server/dist/index.js"]

    # Published to loopback only. `tailscale serve` runs as a systemd unit on the
    # guest and reaches the container this way, while nothing on the guest's
    # network interface can. Publishing "7070:7070" would expose the API on the
    # LAN. Note the process binds 0.0.0.0 *inside* the container, as it must —
    # Docker forwards published ports to the container IP, so binding to
    # container-loopback would make it unreachable.
    ports:
      - "127.0.0.1:7070:7070"

    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # A bounded ring buffer, so logs cannot fill the disk unattended.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
