services:
  server:
    container_name: saffron_server
    image: node:20-alpine
    working_dir: /workspace
    ports:
      - "7070:7070"
    environment:
      - NODE_ENV=development
      - PORT=7070
      - CHOKIDAR_USEPOLLING=1
      - PNPM_STORE_DIR=/pnpm-store
    volumes:
      - ./:/workspace
      - server_node_modules:/workspace/server/node_modules
      - types_node_modules:/workspace/types/node_modules
      - pnpm_store:/pnpm-store
    command: sh -c "corepack enable && corepack prepare pnpm@10.6.5 --activate && [ -x server/node_modules/.bin/ts-node-dev ] || pnpm -C server install && [ -f types/dist/index.js ] || (pnpm -C types install && pnpm -C types build) && pnpm -C server dev"
  client:
    container_name: saffron_client
    image: node:20-alpine
    working_dir: /workspace
    depends_on:
      - server
    ports:
      - "3000:3000"
    environment:
      - SAFFRON_API_URL=http://localhost:7070
      - CHOKIDAR_USEPOLLING=1
      - PNPM_STORE_DIR=/pnpm-store
    volumes:
      - ./:/workspace
      - client_node_modules:/workspace/client/node_modules
      - types_node_modules:/workspace/types/node_modules
      - pnpm_store:/pnpm-store
    command: sh -c "corepack enable && corepack prepare pnpm@10.6.5 --activate && [ -x client/node_modules/.bin/nuxt ] || pnpm -C client install && [ -f types/dist/index.js ] || (pnpm -C types install && pnpm -C types build) && pnpm -C client dev --port 3000 --host 0.0.0.0"
volumes:
  server_node_modules:
  client_node_modules:
  types_node_modules:
  pnpm_store:
